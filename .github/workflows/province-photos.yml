name: province photos (one-off)
on:
  push:
    branches: [province-scenes]
    paths: [scripts/fetch-province-photos.mjs, .github/workflows/province-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-province-photos.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-province-photos
          git commit -m "Candidate province photos from Wikimedia Commons"
          git push
